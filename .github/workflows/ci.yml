name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

  stack:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B package -DskipTests
      - run: docker compose -f deploy/compose.yml up -d --build --wait
      - run: deploy/smoke.sh
      # Only images that passed the smoke check are published, so the demo can be pulled instead of built.
      - if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for module in mock-llm gateway guardian ledger trace leak-lab console; do
            image=ghcr.io/timganev/switchboard-$module
            docker tag $image:latest $image:${GITHUB_SHA::7}
            docker push $image:latest
            docker push $image:${GITHUB_SHA::7}
          done
      - if: failure()
        run: docker compose -f deploy/compose.yml logs
