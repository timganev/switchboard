<text x="406.0" y="362.0" text-anchor="middle">75%</text>
<line class="grid" x1="520.0" y1="24.0" x2="520.0" y2="344.0"/>
<text x="520.0" y="362.0" text-anchor="middle">100%</text>
<line class="grid" x1="64.0" y1="344.0" x2="520.0" y2="344.0"/>
<text x="54.0" y="348.0" text-anchor="end">1</text>
<line class="grid" x1="64.0" y1="264.0" x2="520.0" y2="264.0"/>
<text x="54.0" y="268.0" text-anchor="end">2</text>
<line class="grid" x1="64.0" y1="184.0" x2="520.0" y2="184.0"/>
<text x="54.0" y="188.0" text-anchor="end">3</text>
<line class="grid" x1="64.0" y1="104.0" x2="520.0" y2="104.0"/>
<text x="54.0" y="108.0" text-anchor="end">4</text>
<line class="grid" x1="64.0" y1="24.0" x2="520.0" y2="24.0"/>
<text x="54.0" y="28.0" text-anchor="end">5</text>
<line class="chance" x1="109.6" y1="24.0" x2="109.6" y2="344.0"/>
<text x="115.6" y="336.0" text-anchor="start">blind guess</text>
<text x="292.0" y="388.0" text-anchor="middle">People re-identified by the attacker</text>
<text x="16" y="184.0" text-anchor="middle" transform="rotate(-90 16 184.0)">Answer quality (judge, 1 to 5)</text>
<circle class="dot" cx="520.0" cy="40.0" r="6"><title>NONE: 100% re-identified, quality 4.8, 6204 ms</title></circle>
<text class="label" x="530.0" y="44.0" text-anchor="start">NONE</text>
<circle class="dot" cx="64.0" cy="40.0" r="6"><title>LOCAL: 0% re-identified, quality 4.8, 6088 ms</title></circle>
