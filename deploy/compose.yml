# Build the jars first: ./mvnw -B package -DskipTests
x-service: &service
  build: &build
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped

services:
  redis:
    image: redis:7.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: switchboard
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: switchboard
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "switchboard"]
      interval: 2s
      retries: 30
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL serves the other containers, HOST serves services started on the host with the default config.
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      retries: 30
    ports:
      - "9092:9092"

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # A single local node: a nearly full disk must not stop it from creating the index.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    healthcheck:
      test: ["CMD", "curl", "-sf", "localhost:9200"]
      interval: 5s
      retries: 30
    ports:
      - "9200:9200"

  mock-llm:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: mock-llm
    image: ghcr.io/timganev/switchboard-mock-llm:${SWITCHBOARD_TAG:-latest}
    ports:
      - "8090:8090"

  gateway:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: gateway
    image: ghcr.io/timganev/switchboard-gateway:${SWITCHBOARD_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # A list from the environment replaces the whole list in application.yml, so every field is set.
      SWITCHBOARD_BACKEND_INSTANCES_0_NAME: mock
      SWITCHBOARD_BACKEND_INSTANCES_0_URL: http://mock-llm:8090/v1
      SWITCHBOARD_BACKEND_INSTANCES_0_LOCALITY: LOCAL
      SWITCHBOARD_GUARDIAN_URL: http://guardian:8081
      SWITCHBOARD_BOARD_TYPE: redis
      SPRING_DATA_REDIS_HOST: redis
      SWITCHBOARD_AUTH_TYPE: api-key
      # A demo value; set your own outside of local runs.
      SWITCHBOARD_AUTH_ADMIN_TOKEN: ${SWITCHBOARD_AUTH_ADMIN_TOKEN:-local-demo-admin-token-change-me-0123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/switchboard
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"

  guardian:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: guardian
    image: ghcr.io/timganev/switchboard-guardian:${SWITCHBOARD_TAG:-latest}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # A demo value; set your own outside of local runs.
      SWITCHBOARD_GUARDIAN_SECRET: ${SWITCHBOARD_GUARDIAN_SECRET:-local-demo-secret-change-me-0123456789}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # DECISION_MODEL=local turns on the decision model, a local model at OLLAMA_URL that finds names and health data.
      SWITCHBOARD_GUARDIAN_DECISION_MODEL_TYPE: ${DECISION_MODEL:-none}
      SWITCHBOARD_GUARDIAN_DECISION_MODEL_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SWITCHBOARD_GUARDIAN_DECISION_MODEL_MODEL: ${DECISION_MODEL_NAME:-qwen3.6:35b-a3b}
      SWITCHBOARD_GUARDIAN_DECISION_MODEL_REASONING_EFFORT: none
    ports:
      - "8081:8081"

  ledger:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: ledger
    image: ghcr.io/timganev/switchboard-ledger:${SWITCHBOARD_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/switchboard
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8082:8082"

  trace:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: trace
    image: ghcr.io/timganev/switchboard-trace:${SWITCHBOARD_TAG:-latest}
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SWITCHBOARD_TRACE_OPENSEARCH_URL: http://opensearch:9200
    ports:
      - "8083:8083"

  leak-lab:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: leak-lab
    image: ghcr.io/timganev/switchboard-leak-lab:${SWITCHBOARD_TAG:-latest}
    environment:
      SWITCHBOARD_LEAK_LAB_GUARDIAN_URL: http://guardian:8081
      # The models run on the host, e.g. Ollama; set OLLAMA_URL to use another endpoint.
      SWITCHBOARD_LEAK_LAB_ATTACKER_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SWITCHBOARD_LEAK_LAB_JUDGE_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SWITCHBOARD_LEAK_LAB_CLOUD_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      SWITCHBOARD_LEAK_LAB_LOCAL_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    ports:
      - "8084:8084"

  console:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: console
    image: ghcr.io/timganev/switchboard-console:${SWITCHBOARD_TAG:-latest}
    environment:
      SWITCHBOARD_CONSOLE_GATEWAY_URL: http://gateway:8080
      SWITCHBOARD_CONSOLE_GUARDIAN_URL: http://guardian:8081
      SWITCHBOARD_CONSOLE_ADMIN_TOKEN: ${SWITCHBOARD_AUTH_ADMIN_TOKEN:-local-demo-admin-token-change-me-0123}
    ports:
      - "8088:8088"
