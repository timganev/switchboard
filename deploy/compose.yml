# Build the jars first: ./mvnw -B package -DskipTests
x-service: &service
  build: &build
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped

services:
  redis:
    image: redis:7.4
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: switchboard
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: switchboard
    ports:
      - "5432:5432"

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  mock-llm:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: mock-llm
    ports:
      - "8090:8090"

  gateway:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: gateway
    environment:
      SWITCHBOARD_BACKEND_INSTANCES_0_URL: http://mock-llm:8090/v1
      SWITCHBOARD_GUARDIAN_URL: http://guardian:8081
      SWITCHBOARD_BOARD_TYPE: redis
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"

  guardian:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: guardian
    environment:
      # A demo value; set your own outside of local runs.
      SWITCHBOARD_GUARDIAN_SECRET: ${SWITCHBOARD_GUARDIAN_SECRET:-local-demo-secret-change-me-0123456789}
    ports:
      - "8081:8081"

  ledger:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: ledger
    ports:
      - "8082:8082"

  trace:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: trace
    ports:
      - "8083:8083"

  leak-lab:
    <<: *service
    build:
      <<: *build
      args:
        MODULE: leak-lab
    ports:
      - "8084:8084"
